<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyer → A4 — content-aware PDF crop &amp; rescale</title>
<style>
  :root{
    --paper:#ECEBE5;
    --panel:#FFFFFF;
    --ink:#17181A;
    --ink-dim:#6C6E67;
    --ink-faint:#9B9A91;
    --line:#DBD9CF;
    --line-strong:#C7C5B9;
    --accent:#0072B5;
    --accent-ink:#FFFFFF;
    --danger:#B3261E;
    --danger-bg:#FBEAE8;
    --good:#1D7A46;
    --good-bg:#E9F5EE;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --radius: 3px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(23,24,26,0.055) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding: 28px 16px 60px;
  }

  .sheet{
    max-width: 860px;
    margin: 0 auto;
    background:var(--panel);
    border:1px solid var(--line-strong);
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(23,24,26,0.04), 0 12px 32px -18px rgba(23,24,26,0.25);
    overflow:hidden;
  }

  .regbar{ display:flex; height:6px; }
  .regbar span{ flex:1; }

  header.ticket{ padding: 26px 32px; border-bottom:1px solid var(--line); }
  h1{
    margin:0; font-size: 26px; letter-spacing:0.01em;
    font-weight:800; text-transform:uppercase;
  }

  section.dropzone{
    position:relative;
    margin: 26px 32px 0;
    border: 1.5px dashed var(--line-strong);
    border-radius: 2px;
    padding: 40px 20px;
    text-align:center;
    background: rgba(23,24,26,0.012);
    transition: border-color .15s ease, background-color .15s ease;
    cursor:pointer;
  }
  section.dropzone:hover, section.dropzone:focus-visible, section.dropzone.drag{
    border-color: var(--accent);
    background: rgba(0,114,181,0.045);
    outline:none;
  }
  .crop-corner{ position:absolute; width:16px; height:16px; pointer-events:none; }
  .crop-corner.tl{ top:-1px; left:-1px; border-top:2px solid var(--ink); border-left:2px solid var(--ink); }
  .crop-corner.tr{ top:-1px; right:-1px; border-top:2px solid var(--ink); border-right:2px solid var(--ink); }
  .crop-corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--ink); border-left:2px solid var(--ink); }
  .crop-corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--ink); border-right:2px solid var(--ink); }

  .dz-title{ margin:0 0 16px; font-size:15px; color:var(--ink); font-weight:600; }
  .dz-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .btn{
    appearance:none; border:1px solid var(--line-strong); background:var(--panel);
    color:var(--ink); font:inherit; font-size:13.5px; font-weight:600;
    padding:9px 16px; border-radius: var(--radius); cursor:pointer;
    transition: background-color .12s ease, border-color .12s ease, opacity .12s ease;
  }
  .btn:hover{ border-color:var(--ink-dim); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:#005f96; border-color:#005f96; }
  .btn-ghost{ background:transparent; }
  .btn-text{ background:transparent; border-color:transparent; color:var(--ink-dim); }
  .btn-text:hover{ color:var(--ink); border-color:transparent; text-decoration:underline; }
  .btn-small{ padding:6px 11px; font-size:12.5px; }

  section.queue{ margin: 22px 32px 0; }
  .queue-head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em;
    color:var(--ink-faint); border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  .rows{ border-bottom:1px solid var(--line); }

  .row{
    display:grid;
    grid-template-columns: 56px 1fr auto auto;
    gap:14px; align-items:center;
    padding:12px 0; border-top:1px solid var(--line);
  }
  .row:first-child{ border-top:none; }

  .thumb-frame{
    position:relative; width:56px; height:56px;
    background:#F4F3EF; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .thumb-frame img{ width:100%; height:100%; object-fit:contain; display:block; }
  .thumb-frame .tc{ position:absolute; width:8px; height:8px; pointer-events:none; }
  .thumb-frame .tc.tl{ top:-1px; left:-1px; border-top:1.5px solid var(--ink-faint); border-left:1.5px solid var(--ink-faint); }
  .thumb-frame .tc.br{ bottom:-1px; right:-1px; border-bottom:1.5px solid var(--ink-faint); border-right:1.5px solid var(--ink-faint); }
  .thumb-icon{ color:var(--ink-faint); font-family:var(--mono); font-size:9px; }

  .row-main{ min-width:0; }
  .row-name{
    font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-meta{
    margin-top:3px; font-family:var(--mono); font-size:11px; color:var(--ink-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-meta.err{ color:var(--danger); }

  .pill{
    display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:0.04em;
    padding:3px 8px; border-radius:20px; border:1px solid var(--line-strong);
    color:var(--ink-dim); white-space:nowrap;
  }
  .pill-waiting{ color:var(--ink-faint); }
  .pill-working{ color:var(--accent); border-color:var(--accent); }
  .pill-done{ color:var(--good); border-color:var(--good); background:var(--good-bg); }
  .pill-error{ color:var(--danger); border-color:var(--danger); background:var(--danger-bg); }

  .row-actions{ display:flex; gap:6px; align-items:center; }
  .row-remove{
    background:transparent; border:none; color:var(--ink-faint); cursor:pointer;
    font-size:16px; line-height:1; padding:4px 6px;
  }
  .row-remove:hover{ color:var(--danger); }

  .actionbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding: 18px 32px;
  }
  .progress-text{
    font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); margin-left:auto;
  }

  .footnote{
    margin:0; padding: 16px 32px 26px; font-size:12px; color:var(--ink-faint);
    border-top:1px solid var(--line);
  }
  .footnote strong{ color:var(--ink-dim); }

  input[type=file]{ display:none; }

  @media (max-width: 560px){
    header.ticket, section.dropzone, section.queue, .actionbar, .footnote{ margin-left:16px; margin-right:16px; }
    header.ticket, .actionbar, .footnote{ padding-left:0; padding-right:0; }
    .row{ grid-template-columns: 44px 1fr auto; }
    .row-actions{ grid-column:1/-1; justify-content:flex-end; margin-top:6px; }
    .progress-text{ margin-left:0; width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="regbar" aria-hidden="true">
    <span style="background:#00AEEF"></span>
    <span style="background:#EC008C"></span>
    <span style="background:#FFD400"></span>
    <span style="background:#17181A"></span>
  </div>

  <header class="ticket">
    <h1>Flyer&nbsp;→&nbsp;A4</h1>
  </header>

  <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Choose PDF files or a folder to convert">
    <div class="crop-corner tl"></div>
    <div class="crop-corner tr"></div>
    <div class="crop-corner bl"></div>
    <div class="crop-corner br"></div>
    <p class="dz-title">Drop PDF files or a folder here</p>
    <div class="dz-actions">
      <button type="button" id="btnFiles" class="btn btn-primary">Choose files</button>
      <button type="button" id="btnFolder" class="btn btn-ghost">Choose folder</button>
    </div>
    <input type="file" id="inputFiles" accept="application/pdf,.pdf" multiple>
    <input type="file" id="inputFolder" accept="application/pdf,.pdf" multiple webkitdirectory>
  </section>

  <section id="queue" class="queue" hidden>
    <div class="queue-head">
      <span id="queueCount">0 files</span>
    </div>
    <div id="rows" class="rows"></div>
  </section>

  <div id="actionbar" class="actionbar" hidden>
    <button type="button" id="btnConvert" class="btn btn-primary">Convert all</button>
    <button type="button" id="btnDownloadZip" class="btn btn-ghost" disabled>Download all (.zip)</button>
    <button type="button" id="btnClear" class="btn btn-text">Clear</button>
    <span id="progressText" class="progress-text"></span>
  </div>

  <p class="footnote">Print at <strong>Actual Size / 100%</strong> — not “Fit to page.”</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
(function(){
  "use strict";

  // ---- config (mirrors the original Python script) ----------------------
  var A4_PT = [595.28, 841.89];   // [width, height] portrait, in points
  var WHITE_THRESHOLD = 245;      // pixels brighter (0-255 luma) than this = white
  var DETECT_DPI = 100;           // matches page.get_pixmap(dpi=100)
  var MAX_DETECT_PX = 2200;       // safety cap on the longest side of the scan canvas

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  var PDFDocument = PDFLib.PDFDocument;

  // ---- state --------------------------------------------------------------
  var items = [];   // {id, file, name, status, error, pageInfo, outBytes, outName, previewDataUrl}
  var seq = 0;
  var converting = false;

  // ---- dom ------------------------------------------------------------------
  var dropzone = document.getElementById("dropzone");
  var inputFiles = document.getElementById("inputFiles");
  var inputFolder = document.getElementById("inputFolder");
  var btnFiles = document.getElementById("btnFiles");
  var btnFolder = document.getElementById("btnFolder");
  var queueSection = document.getElementById("queue");
  var queueCount = document.getElementById("queueCount");
  var rowsEl = document.getElementById("rows");
  var actionbar = document.getElementById("actionbar");
  var btnConvert = document.getElementById("btnConvert");
  var btnDownloadZip = document.getElementById("btnDownloadZip");
  var btnClear = document.getElementById("btnClear");
  var progressText = document.getElementById("progressText");

  btnFiles.addEventListener("click", function(){ inputFiles.click(); });
  btnFolder.addEventListener("click", function(){ inputFolder.click(); });
  dropzone.addEventListener("click", function(e){
    if (e.target === btnFiles || e.target === btnFolder) return;
    inputFiles.click();
  });
  dropzone.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inputFiles.click(); }
  });

  inputFiles.addEventListener("change", function(){
    addFiles(inputFiles.files);
    inputFiles.value = "";
  });
  inputFolder.addEventListener("change", function(){
    addFiles(inputFolder.files);
    inputFolder.value = "";
  });

  ["dragenter","dragover"].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add("drag");
    });
  });
  ["dragleave","drop"].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove("drag");
    });
  });
  dropzone.addEventListener("drop", function(e){
    var dt = e.dataTransfer;
    if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
      var entries = [];
      for (var i=0;i<dt.items.length;i++){
        var entry = dt.items[i].webkitGetAsEntry && dt.items[i].webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
      if (entries.length){
        collectEntries(entries).then(function(files){ addFiles(files); });
        return;
      }
    }
    addFiles(dt.files);
  });

  function collectEntries(entries){
    var found = [];
    function walk(entry){
      return new Promise(function(resolve){
        if (entry.isFile){
          entry.file(function(f){ found.push(f); resolve(); }, function(){ resolve(); });
        } else if (entry.isDirectory){
          var reader = entry.createReader();
          var readBatch = function(){
            reader.readEntries(function(batch){
              if (!batch.length){ resolve(); return; }
              Promise.all(batch.map(walk)).then(readBatch);
            }, function(){ resolve(); });
          };
          readBatch();
        } else { resolve(); }
      });
    }
    return Promise.all(entries.map(walk)).then(function(){ return found; });
  }

  function addFiles(fileList){
    var arr = Array.prototype.slice.call(fileList || []);
    var pdfs = arr.filter(function(f){ return /\.pdf$/i.test(f.name); });
    pdfs.forEach(function(file){
      items.push({
        id: "f" + (++seq),
        file: file,
        name: file.name,
        status: "waiting",
        error: null,
        pageInfo: null,
        outBytes: null,
        outName: null,
        previewDataUrl: null
      });
    });
    if (pdfs.length) renderQueue();
  }

  function renderQueue(){
    var hasItems = items.length > 0;
    queueSection.hidden = !hasItems;
    actionbar.hidden = !hasItems;
    queueCount.textContent = items.length + (items.length === 1 ? " file" : " files");

    rowsEl.innerHTML = "";
    items.forEach(function(it){
      rowsEl.appendChild(buildRow(it));
    });

    var doneCount = items.filter(function(it){ return it.status === "done"; }).length;
    btnDownloadZip.disabled = doneCount === 0;
    btnConvert.disabled = converting;
  }

  function buildRow(it){
    var row = document.createElement("div");
    row.className = "row";
    row.dataset.id = it.id;

    var thumb = document.createElement("div");
    thumb.className = "thumb-frame";
    if (it.previewDataUrl){
      var img = document.createElement("img");
      img.src = it.previewDataUrl;
      img.alt = "";
      thumb.appendChild(img);
      var c1=document.createElement("div"); c1.className="tc tl"; thumb.appendChild(c1);
      var c2=document.createElement("div"); c2.className="tc br"; thumb.appendChild(c2);
    } else {
      var icon = document.createElement("span");
      icon.className = "thumb-icon";
      icon.textContent = "PDF";
      thumb.appendChild(icon);
    }

    var main = document.createElement("div");
    main.className = "row-main";
    var nameEl = document.createElement("div");
    nameEl.className = "row-name";
    nameEl.title = it.name;
    nameEl.textContent = it.name;
    var metaEl = document.createElement("div");
    metaEl.className = "row-meta" + (it.status === "error" ? " err" : "");
    metaEl.textContent = metaText(it);
    main.appendChild(nameEl);
    main.appendChild(metaEl);

    var statusEl = document.createElement("div");
    var pill = document.createElement("span");
    pill.className = "pill " + pillClass(it.status);
    pill.textContent = pillLabel(it.status);
    statusEl.appendChild(pill);

    var actions = document.createElement("div");
    actions.className = "row-actions";
    var dl = document.createElement("button");
    dl.type = "button";
    dl.className = "btn btn-small";
    dl.textContent = "Download";
    dl.disabled = it.status !== "done";
    dl.addEventListener("click", function(){ downloadItem(it); });
    var rm = document.createElement("button");
    rm.type = "button";
    rm.className = "row-remove";
    rm.setAttribute("aria-label", "Remove " + it.name);
    rm.textContent = "\u00D7";
    rm.addEventListener("click", function(){ removeItem(it.id); });
    actions.appendChild(dl);
    actions.appendChild(rm);

    row.appendChild(thumb);
    row.appendChild(main);
    row.appendChild(statusEl);
    row.appendChild(actions);
    return row;
  }

  function metaText(it){
    if (it.status === "error") return it.error || "Conversion failed";
    if (it.pageInfo) return it.pageInfo;
    var kb = it.file.size / 1024;
    return kb > 1024 ? (kb/1024).toFixed(1) + " MB" : Math.round(kb) + " KB";
  }

  function pillClass(status){
    if (status === "working") return "pill-working";
    if (status === "done") return "pill-done";
    if (status === "error") return "pill-error";
    return "pill-waiting";
  }
  function pillLabel(status){
    if (status === "working") return "Converting…";
    if (status === "done") return "Ready";
    if (status === "error") return "Error";
    return "Waiting";
  }

  function removeItem(id){
    items = items.filter(function(it){ return it.id !== id; });
    renderQueue();
  }

  btnClear.addEventListener("click", function(){
    if (converting) return;
    items = [];
    renderQueue();
  });

  btnConvert.addEventListener("click", function(){
    if (converting) return;
    convertAll();
  });

  btnDownloadZip.addEventListener("click", function(){
    downloadAllZip();
  });

  // ---- conversion pipeline --------------------------------------------------

  function convertAll(){
    var pending = items.filter(function(it){ return it.status === "waiting" || it.status === "error"; });
    if (!pending.length) return;
    converting = true;
    btnConvert.disabled = true;
    var i = 0;
    function next(){
      if (i >= pending.length){
        converting = false;
        progressText.textContent = "";
        renderQueue();
        return;
      }
      var it = pending[i];
      progressText.textContent = "Converting " + (i+1) + " of " + pending.length + " — " + it.name;
      processFile(it).then(function(){
        i++; next();
      });
    }
    next();
  }

  function processFile(it){
    it.status = "working";
    it.error = null;
    renderQueue();

    return readFile(it.file).then(function(arrayBuffer){
      var bytesForLib = new Uint8Array(arrayBuffer);
      var bytesForJs = new Uint8Array(arrayBuffer.slice(0));

      return PDFDocument.load(bytesForLib, { ignoreEncryption: true }).then(function(srcDoc){
        return pdfjsLib.getDocument({ data: bytesForJs }).promise.then(function(pdfjsDoc){
          return PDFDocument.create().then(function(outDoc){
            var srcPages = srcDoc.getPages();
            var numPages = pdfjsDoc.numPages;
            var firstPreview = null;
            var firstCropInfo = null;

            var p = Promise.resolve();
            var _loop = function(pageIndex){
              p = p.then(function(){
                return pdfjsDoc.getPage(pageIndex + 1).then(function(pdfjsPage){
                  return renderAndCrop(pdfjsPage).then(function(res){
                    var srcPage = srcPages[pageIndex];
                    return outDoc.embedPage(srcPage, res.crop).then(function(embedded){
                      var landscape = res.crop.width >= res.crop.height;
                      var pageW = landscape ? A4_PT[1] : A4_PT[0];
                      var pageH = landscape ? A4_PT[0] : A4_PT[1];
                      var newPage = outDoc.addPage([pageW, pageH]);
                      newPage.drawPage(embedded, { x: 0, y: 0, width: pageW, height: pageH });
                      if (pageIndex === 0){
                        firstPreview = res.previewDataUrl;
                        firstCropInfo = (landscape ? "A4 landscape" : "A4 portrait") +
                          (numPages > 1 ? " · " + numPages + " pages" : "");
                      }
                    });
                  });
                });
              });
            };
            for (var pageIndex = 0; pageIndex < numPages; pageIndex++) _loop(pageIndex);

            return p.then(function(){ return outDoc.save(); }).then(function(outBytes){
              it.outBytes = outBytes;
              it.outName = it.name.replace(/\.pdf$/i, "") + "_A4.pdf";
              it.previewDataUrl = firstPreview;
              it.pageInfo = firstCropInfo;
              it.status = "done";
            });
          });
        });
      });
    }).catch(function(err){
      it.status = "error";
      it.error = (err && err.message) ? err.message : "Could not convert this file";
    });
  }

  function readFile(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(reader.error || new Error("File read failed")); };
      reader.readAsArrayBuffer(file);
    });
  }

  // Renders one pdf.js page to an offscreen canvas at ~DETECT_DPI, scans for
  // the non-white content box, and returns both the crop rect (in PDF points,
  // suitable for PDFLib embedPage) and a data URL preview cropped/stretched
  // to the same aspect ratio the final A4 page will have.
  function renderAndCrop(pdfjsPage){
    var baseView = pdfjsPage.view; // [x0, y0, x1, y1], unrotated
    var pageWpt = baseView[2] - baseView[0];
    var pageHpt = baseView[3] - baseView[1];

    var scale = DETECT_DPI / 72;
    var longSide = Math.max(pageWpt, pageHpt) * scale;
    if (longSide > MAX_DETECT_PX) scale *= MAX_DETECT_PX / longSide;

    var viewport = pdfjsPage.getViewport({ scale: scale, rotation: 0 });
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(viewport.width));
    canvas.height = Math.max(1, Math.round(viewport.height));
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    return pdfjsPage.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
      var box = detectContentBox(ctx, canvas.width, canvas.height, WHITE_THRESHOLD);

      var leftPx, topPx, rightPx, bottomPx;
      if (!box){
        leftPx = 0; topPx = 0; rightPx = canvas.width; bottomPx = canvas.height;
      } else {
        leftPx = box.left; topPx = box.top; rightPx = box.right; bottomPx = box.bottom;
      }

      var sx = pageWpt / canvas.width;
      var sy = pageHpt / canvas.height;
      var ox = baseView[0], oy = baseView[1];

      var crop = {
        left:   ox + leftPx * sx,
        right:  ox + rightPx * sx,
        top:    oy + (pageHpt - topPx * sy),
        bottom: oy + (pageHpt - bottomPx * sy)
      };
      crop.width = crop.right - crop.left;
      crop.height = crop.top - crop.bottom;

      // Build a small preview stretched the same way the output PDF will be.
      var pw = rightPx - leftPx, ph = bottomPx - topPx;
      var landscape = crop.width >= crop.height;
      var destW = landscape ? 120 : 90;
      var destH = landscape ? 90 : 120;
      var pc = document.createElement("canvas");
      pc.width = destW; pc.height = destH;
      var pctx = pc.getContext("2d");
      pctx.drawImage(canvas, leftPx, topPx, Math.max(pw,1), Math.max(ph,1), 0, 0, destW, destH);

      return { crop: crop, previewDataUrl: pc.toDataURL("image/png") };
    });
  }

  function detectContentBox(ctx, w, h, threshold){
    var data = ctx.getImageData(0, 0, w, h).data;
    var rowHas = new Uint8Array(h);
    var colHas = new Uint8Array(w);
    var any = false;
    for (var y = 0; y < h; y++){
      var rowOff = y * w * 4;
      for (var x = 0; x < w; x++){
        var i = rowOff + x * 4;
        var lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        if (lum < threshold){
          rowHas[y] = 1; colHas[x] = 1; any = true;
        }
      }
    }
    if (!any) return null;

    var top = 0; while (top < h && !rowHas[top]) top++;
    var bottom = h; while (bottom > 0 && !rowHas[bottom-1]) bottom--;
    var left = 0; while (left < w && !colHas[left]) left++;
    var right = w; while (right > 0 && !colHas[right-1]) right--;

    return { top: top, bottom: bottom, left: left, right: right };
  }

  // ---- downloads --------------------------------------------------------------

  function downloadItem(it){
    if (!it.outBytes) return;
    var blob = new Blob([it.outBytes], { type: "application/pdf" });
    triggerDownload(blob, it.outName);
  }

  function downloadAllZip(){
    var done = items.filter(function(it){ return it.status === "done"; });
    if (!done.length) return;
    var zip = new JSZip();
    var used = {};
    done.forEach(function(it){
      var name = it.outName;
      if (used[name]){
        used[name]++;
        name = name.replace(/\.pdf$/i, "") + "_" + used[name] + ".pdf";
      } else {
        used[name] = 1;
      }
      zip.file(name, it.outBytes);
    });
    zip.generateAsync({ type: "blob" }).then(function(blob){
      triggerDownload(blob, "A4_output.zip");
    });
  }

  function triggerDownload(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

})();
</script>
